<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>早押しクイズロワイヤル</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif; }
  body { margin: 0; min-height: 100dvh; display: grid; place-content: center; gap: 16px; padding: 16px; text-align: center; }
  button { padding: 12px 24px; border: 1px solid; border-radius: 8px; background: none; color: inherit; font: inherit; }
</style>
</head>
<body>
  <p>インターネットにつながっていません。<br>つながったら、もう一度ためしてね。</p>
  <button type="button" onclick="location.reload()">もう一度読みこむ</button>
</body>
</html>
